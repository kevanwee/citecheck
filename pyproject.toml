[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citecheck"
version = "0.1.0"
description = "Extract every legal citation from a draft, resolve each against a source, and fail loudly on anything that does not exist. Library, CLI and Claude skill."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8", "ruff>=0.5", "python-docx>=1.1"]

[project.scripts]
citecheck = "citecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
